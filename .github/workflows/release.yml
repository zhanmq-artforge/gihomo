name: Release & Multi-Arch Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      prerelease:
        description: "Create pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-packages:
    name: Build & Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libpolkit-gobject-1-dev \
            libcap2-bin \
            desktop-file-utils \
            appstream \
            rpm \
            zstd \
            file \
            fuse3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Compile Release Binary
        run: cargo build --release

      - name: Build All Package Formats (.deb, .rpm, .tar.gz, .pkg.tar.zst, .AppImage)
        run: |
          ./scripts/package-all.sh "${{ matrix.arch }}"

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > "SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gihomo-dist-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  publish-release:
    name: Publish Release Assets
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Consolidate Unified SHA256SUMS
        run: |
          cd dist
          cat SHA256SUMS-*.txt | sort -u > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
