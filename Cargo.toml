[workspace]
resolver = "2"
members = [
    ".",
    "crates/gihomo-core",
    "crates/gihomo-infra",
    "crates/gihomo-app",
    "crates/gihomo-ui",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["ArtForge Team <team@artforge.org>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/artforge/gihomo"

[workspace.dependencies]
# Internal workspace crates
gihomo-core = { path = "crates/gihomo-core" }
gihomo-infra = { path = "crates/gihomo-infra" }
gihomo-app = { path = "crates/gihomo-app" }
gihomo-ui = { path = "crates/gihomo-ui" }

# GTK4 / GNOME Ecosystem
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"

# System Tray (StatusNotifierItem)
ksni = "0.3"

# Asynchronous & Concurrency
tokio = { version = "1.40", features = ["full"] }
async-channel = "2.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

# Networking & Serialization
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
url = "2.5"

# System & Utilities
dirs = "7.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
libc = "0.2"

[package]
name = "gihomo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Modern native GTK4 + Libadwaita management client for Mihomo"

[[bin]]
name = "gihomo"
path = "src/main.rs"

[dependencies]
gihomo-app = { workspace = true }
gihomo-ui = { workspace = true }
tokio = { workspace = true }
glib = { workspace = true }
gio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[package.metadata.deb]
maintainer = "ArtForge Team <team@artforge.org>"
copyright = "2026 ArtForge Team"
license-file = ["LICENSE", "4"]
depends = "libc6, libgtk-4-1, libadwaita-1-0, libglib2.0-0, libcap2-bin"
section = "net"
priority = "optional"
assets = [
    ["target/release/gihomo", "usr/bin/gihomo", "755"],
    ["assets/mihomo", "usr/lib/gihomo/bin/mihomo", "755"],
    ["data/art.artforge.Gihomo.desktop.in", "usr/share/applications/art.artforge.Gihomo.desktop", "644"],
    ["data/icons/hicolor/scalable/apps/art.artforge.Gihomo.svg", "usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo.svg", "644"],
    ["data/icons/hicolor/scalable/apps/art.artforge.Gihomo-blue.svg", "usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-blue.svg", "644"],
    ["data/icons/hicolor/scalable/apps/art.artforge.Gihomo-gray.svg", "usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-gray.svg", "644"],
    ["data/icons/hicolor/scalable/apps/art.artforge.Gihomo-green.svg", "usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-green.svg", "644"],
    ["data/icons/hicolor/scalable/apps/art.artforge.Gihomo-red.svg", "usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-red.svg", "644"],
    ["data/art.artforge.Gihomo.gschema.xml", "usr/share/glib-2.0/schemas/art.artforge.Gihomo.gschema.xml", "644"],
    ["data/art.artforge.Gihomo.metainfo.xml.in", "usr/share/metainfo/art.artforge.Gihomo.metainfo.xml", "644"],
    ["data/art.artforge.Gihomo.rules", "usr/share/polkit-1/rules.d/art.artforge.Gihomo.rules", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gihomo", dest = "/usr/bin/gihomo", mode = "755" },
    { source = "assets/mihomo", dest = "/usr/lib/gihomo/bin/mihomo", mode = "755" },
    { source = "data/art.artforge.Gihomo.desktop.in", dest = "/usr/share/applications/art.artforge.Gihomo.desktop", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/art.artforge.Gihomo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo.svg", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/art.artforge.Gihomo-blue.svg", dest = "/usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-blue.svg", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/art.artforge.Gihomo-gray.svg", dest = "/usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-gray.svg", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/art.artforge.Gihomo-green.svg", dest = "/usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-green.svg", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/art.artforge.Gihomo-red.svg", dest = "/usr/share/icons/hicolor/scalable/apps/art.artforge.Gihomo-red.svg", mode = "644" },
    { source = "data/art.artforge.Gihomo.gschema.xml", dest = "/usr/share/glib-2.0/schemas/art.artforge.Gihomo.gschema.xml", mode = "644" },
    { source = "data/art.artforge.Gihomo.metainfo.xml.in", dest = "/usr/share/metainfo/art.artforge.Gihomo.metainfo.xml", mode = "644" },
    { source = "data/art.artforge.Gihomo.rules", dest = "/usr/share/polkit-1/rules.d/art.artforge.Gihomo.rules", mode = "644" },
]
